name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, Development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # RSA is backed by OpenSSL on Linux and CNG on Windows, so signing is tested on both
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RevenueMonsterLibrary.slnx

      - name: Build
        run: dotnet build RevenueMonsterLibrary.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test RevenueMonsterLibrary.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
